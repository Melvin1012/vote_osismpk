<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>E-Voting OSIS & MPK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../front end/style/login.css">
</head>
<body>
  <div class="container">
    <div class="welcome-box">
      <h3>E-Voting OSIS & MPK</h3>
      <p>Selamat Datang!<br>Silakan login untuk memulai voting.</p>
      <br>
      <a href="#login">Login</a>
    </div>

    <div class="login-card" id="login">
      <h4>Login </h4>

      <form>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>

        <button type="submit">Login</button>
      </form>

      <div class="small-text">Can't access login</div>
    </div>
  </div>

</body>
</html>
